<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Restaurant</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><div class="brand" id="brand">🍽️ My Restaurant</div><nav><button onclick="openAdmin()">Admin Login</button><button onclick="openCart()">🛒 Cart <b id="cartCount">0</b></button></nav></header>
<main><section class="hero"><h1>Fresh food, delivered.</h1><p>Choose your favourites and place one simple order.</p></section><section><h2>Menu</h2><div id="menu" class="grid"></div></section></main>
<div id="cartModal" class="modal"><div class="box"><button class="close" onclick="closeModals()">×</button><h2>Your Cart</h2><div id="cartItems"></div><div class="total">Total: ₹<span id="cartTotal">0</span></div><button class="primary" onclick="checkout()">Place Order</button></div></div>
<div id="checkoutModal" class="modal"><div class="box"><button class="close" onclick="closeModals()">×</button><h2>Checkout</h2><form onsubmit="placeOrder(event)"><input id="customerName" required placeholder="Name"><input id="customerPhone" required placeholder="Mobile number" inputmode="tel"><textarea id="customerAddress" required placeholder="Delivery address"></textarea><label>Payment</label><select><option>Cash on Delivery</option></select><button class="primary">Submit Order</button></form></div></div>
<div id="adminModal" class="modal admin-modal"><div class="admin-box"><button class="close" onclick="closeModals()">×</button><div id="adminContent"><h2>Admin Login</h2><form onsubmit="adminLogin(event)"><input id="adminUser" required placeholder="Username"><input id="adminPass" required type="password" placeholder="Password"><button class="primary">Login</button></form></div></div></div>
<footer>© <span id="year"></span> <span id="footerName">My Restaurant</span></footer><script src="script.js"></script></body></html>
